<!doctype html>
<html lang="zh-CN" data-phase="unknown">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>浮光 · 玻璃翻页时钟</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #000; --ink: #edf0f5; --muted: #9ba6b6;
      --accent: #bed0e8; --accent-soft: #bdc7d5;
      --glow-a: #d8aa92; --glow-b: #b5c5c6; --glow-c: #e6d3af;
      --glass: rgba(255,255,255,.045); --rim: rgba(219,232,255,.24);
      --flip: #171e2b; --shadow: rgba(0,0,0,.5);
      --digit-size: clamp(64px, 15vw, 192px);
      --tile-width: clamp(108px, 23vw, 282px);
      --tile-height: clamp(144px, 29vw, 348px);
      --tile-radius: clamp(18px, 2.8vw, 32px);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body {
      margin:0; min-height:100vh; min-height:100svh; color:var(--ink);
      background:var(--paper); transition:background .6s, color .6s;
      -webkit-font-smoothing:antialiased;
    }
    button, input { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:focus-visible, input:focus-visible + span {
      outline:2px solid var(--accent); outline-offset:5px;
    }
    .ambient { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; background:#000; }
    #weather-canvas { display:block; width:100%; height:100%;
      -webkit-mask-image:radial-gradient(ellipse 50% 50% at center,#000 42%,rgba(0,0,0,.93) 64%,rgba(0,0,0,.5) 80%,transparent 96%);
      mask-image:radial-gradient(ellipse 50% 50% at center,#000 42%,rgba(0,0,0,.93) 64%,rgba(0,0,0,.5) 80%,transparent 96%);
    }
    .shell { position:relative; z-index:1; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; padding:38px 48px 26px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:13px; }
    .brand-mark { width:32px; height:32px; color:var(--accent); }
    .brand-name { font-family:"Iowan Old Style", "Songti SC", serif; font-size:23px; letter-spacing:.15em; }
    .brand-caption { font-size:9px; letter-spacing:.2em; margin-top:5px; color:var(--muted); }
    .top-actions { display:flex; align-items:center; gap:22px; }
    .local-label { display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.08em; color:var(--muted); }
    .local-label svg { width:13px; height:13px; }
    .icon-button {
      width:42px; height:42px; display:grid; place-items:center; border-radius:50%;
      border:1px solid var(--rim); background:var(--glass);
      box-shadow:0 3px 12px rgba(50,40,30,.035),inset 0 1px 0 rgba(255,255,255,.3);
      transition:background .2s, transform .2s;
    }
    .icon-button:hover { background:var(--rim); transform:translateY(-1px); }
    .icon-button svg { width:17px; height:17px; }
    main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:52px 0 46px; }
    .intro { text-align:center; margin-bottom:34px; }
    .eyebrow { font-size:10px; font-weight:500; letter-spacing:.3em; color:var(--muted); margin:0 0 15px; }
    .date-line { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; }
    .date-line time { font-size:15px; letter-spacing:.12em; }
    .date-divider { width:3px; height:3px; background:var(--accent); border-radius:50%; }
    .weekday { color:var(--accent); font-size:13px; letter-spacing:.12em; }
    .clock { display:flex; align-items:flex-start; justify-content:center; gap:0; }
    .unit { width:var(--tile-width); text-align:center; }
    .tile {
      height:var(--tile-height); position:relative; border-radius:var(--tile-radius);
      perspective:1200px; isolation:isolate;
      background:linear-gradient(140deg,rgba(255,255,255,.35),rgba(255,255,255,.045) 50%,rgba(255,255,255,.18));
      -webkit-backdrop-filter:blur(22px) saturate(1.18); backdrop-filter:blur(22px) saturate(1.18);
      box-shadow:0 25px 48px -17px var(--shadow),0 7px 15px -7px var(--shadow),
        inset 0 0 0 1px var(--rim),inset 1px 2px 2px rgba(255,255,255,.7),
        inset -1px -1px 2px rgba(255,255,255,.36);
    }
    .tile::after {
      content:""; position:absolute; inset:1px; pointer-events:none; border-radius:calc(var(--tile-radius) - 1px);
      background:linear-gradient(125deg,rgba(255,255,255,.21),transparent 25%,transparent 75%,rgba(255,255,255,.12));
      z-index:6;
    }
    .half { position:absolute; left:0; width:100%; height:50%; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
    .half.top { top:0; border-radius:var(--tile-radius) var(--tile-radius) 0 0; }
    .half.bottom { bottom:0; border-radius:0 0 var(--tile-radius) var(--tile-radius); }
    .numeral {
      position:absolute; inset-inline:0; height:var(--tile-height); display:flex; align-items:center; justify-content:center;
      font-family:"SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size:var(--digit-size); font-weight:250; font-variant-numeric:tabular-nums;
      letter-spacing:-.065em; padding-right:.065em; line-height:1; color:var(--ink);
      text-shadow:0 1px 1px rgba(255,255,255,.35); user-select:none;
    }
    .top .numeral { top:0; }
    .bottom .numeral { bottom:0; }
    .static.top { background:linear-gradient(to bottom,rgba(255,255,255,.06),rgba(80,62,45,.025)); }
    .static.bottom { background:linear-gradient(to bottom,rgba(255,255,255,.11),rgba(255,255,255,.015)); }
    .seam {
      position:absolute; top:50%; height:1px; left:1px; right:1px; z-index:7;
      background:rgba(80,65,50,.15); box-shadow:0 1px 0 rgba(255,255,255,.58); pointer-events:none;
    }
    .seam::before,.seam::after {
      content:""; position:absolute; top:-3px; width:3px; height:7px; border-radius:2px;
      background:var(--muted); opacity:.28;
    }
    .seam::before { left:0; } .seam::after { right:0; }
    .flap { display:none; background:var(--flip); z-index:4; }
    .flap.top { transform-origin:center bottom; }
    .flap.bottom { transform-origin:center top; transform:rotateX(90deg); z-index:5; }
    .flap.top::after,.flap.bottom::after {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(120deg,rgba(255,255,255,.2),transparent 60%);
      box-shadow:inset 0 0 0 1px var(--rim);
    }
    .tile.flipping .flap { display:block; }
    .tile.flipping .flap.top { animation:fold-up .32s cubic-bezier(.55,.06,.75,.43) both; }
    .tile.flipping .flap.bottom { animation:fold-down .4s .32s cubic-bezier(.15,.55,.3,1) both; }
    @keyframes fold-up { from {transform:rotateX(0);filter:brightness(1)} to {transform:rotateX(-90deg);filter:brightness(.83)} }
    @keyframes fold-down { from {transform:rotateX(90deg);filter:brightness(.83)} to {transform:rotateX(0);filter:brightness(1)} }
    .unit-label { margin-top:22px; color:var(--muted); font-size:10px; letter-spacing:.23em; }
    .unit-label span { margin-right:9px; font-size:11px; letter-spacing:0; }
    .colon { height:var(--tile-height); width:clamp(25px,4.5vw,58px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:25px; }
    .colon::before,.colon::after { content:""; width:5px; height:5px; background:var(--accent); opacity:.6; border-radius:50%; }
    .seconds-cluster { display:flex; }
    .reflection { height:1px; width:65%; margin:45px 0 0; background:linear-gradient(90deg,transparent,var(--rim),transparent); }
    .closing { margin:26px 0 0; font-family:"Iowan Old Style",Baskerville,Georgia,serif; font-style:italic; font-size:21px; font-weight:400; letter-spacing:.01em; color:var(--muted); }
    .settings {
      display:flex; align-items:center; justify-content:center; gap:22px; margin-top:34px;
      padding:11px 18px; border:1px solid var(--rim); border-radius:40px; background:var(--glass);
      -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
      box-shadow:0 5px 20px rgba(60,45,30,.025),inset 0 1px 0 rgba(255,255,255,.18);
    }
    .settings-divider { width:1px; height:19px; background:var(--muted); opacity:.22; }
    .seconds-control { position:relative; display:flex; align-items:center; gap:11px; cursor:pointer; font-size:12px; color:var(--ink); min-height:30px; user-select:none; }
    .seconds-control input { position:absolute; width:100%; height:100%; inset:0; margin:0; opacity:0; cursor:pointer; z-index:1; }
    .switch { display:block; width:30px; height:18px; border-radius:20px; background:rgba(100,95,90,.25); transition:background .2s; }
    .switch::after { content:""; display:block; width:14px; height:14px; margin:2px; background:#fffaf3; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.16); transition:transform .2s; }
    input:checked + .switch { background:var(--accent); }
    input:checked + .switch::after { transform:translateX(12px); }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:16px; color:var(--muted); font-size:10px; letter-spacing:.13em; }
    .footer-note { display:flex; align-items:center; gap:8px; }
    .status-dot { width:4px; height:4px; background:var(--accent); border-radius:50%; }
    .footer-en { font-size:9px; letter-spacing:.17em; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .notice { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:12px 20px; border-radius:20px; background:var(--flip); border:1px solid var(--rim); color:var(--ink); font-size:13px; box-shadow:0 8px 30px var(--shadow); }
    @media (min-width:1000px) { body.seconds-hidden { --tile-width:310px; --tile-height:348px; --digit-size:200px; } }
    @media (max-width:640px) {
      :root { --tile-width:25vw; --tile-height:35vw; --digit-size:18vw; --tile-radius:19px; }
      body.seconds-hidden { --tile-width:37vw; --tile-height:48vw; --digit-size:27vw; }
      .shell { padding:26px 22px 22px; }
      .brand-name { font-size:21px; } .brand-caption { font-size:8px; }
      .local-label { display:none; }
      main { padding:54px 0; }
      .intro { margin-bottom:32px; }
      .date-line { gap:9px; } .date-line time { font-size:13px; letter-spacing:.06em; }
      .weekday { font-size:12px; } .eyebrow { font-size:9px; }
      .colon { width:5vw; gap:17px; } .colon::before,.colon::after { width:4px; height:4px; }
      .unit-label { margin-top:17px; font-size:8px; letter-spacing:.13em; }
      .unit-label span { margin-right:5px; font-size:10px; }
      .closing { font-size:20px; margin-top:26px; } .reflection { margin-top:37px; }
      .settings { margin-top:30px; gap:18px; }
      .footer { font-size:9px; } .footer-en { font-size:8px; }
    }
    @media (max-height:700px) and (min-width:641px) {
      :root, body.seconds-hidden { --tile-height:clamp(190px,26vw,240px); --tile-width:clamp(140px,22vw,200px); --digit-size:clamp(100px,16vw,150px); }
      .shell { padding-top:24px; padding-bottom:20px; } main { padding:28px 0; }
      .intro { margin-bottom:24px; } .reflection { margin-top:26px; }
      .closing { margin-top:18px; } .settings { margin-top:24px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

    /* The weather is the light source; all four edges dissolve into the black canvas. */
    body { background:#000; }
    main { padding:38px 0; }
    .tile {
      --light-angle:320deg; --surface-light:rgba(188,210,255,.08); --edge-light:rgba(210,225,255,.28);
      --number-light:#e4edff; --number-shade:#8493ac; --digit-x:-1px; --digit-y:2px; --digit-blur:4px;
      --cast-x:0px; --cast-y:15px;
      background:transparent; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none;
    }
    .tile::after,.seam,.flap.top::after,.flap.bottom::after { display:none; }
    .numeral {
      background:linear-gradient(var(--light-angle),var(--number-shade) 4%,var(--number-light) 90%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:none;
      font-family:var(--clock-font,-apple-system,BlinkMacSystemFont,sans-serif); letter-spacing:var(--digit-spacing,0px); padding:0;
    }
    .static.top,.static.bottom,.flap { background:transparent; }

    .tile.flipping .static.top { animation:reveal-top .24s step-end both; }
    .tile.flipping .static.bottom { animation:hide-bottom .24s step-end both; }
    @keyframes reveal-top { from {opacity:0} to {opacity:1} }
    @keyframes hide-bottom { from {opacity:1} to {opacity:0} }
    .settings { margin-top:37px; gap:18px; }
    .text-button { border:0; background:transparent; padding:8px 0; font-size:12px; color:var(--ink); }
    .text-button:hover { color:var(--accent); }
    .text-button:disabled { opacity:.45; cursor:wait; }
    .weather-info { text-align:center; font-size:11px; line-height:1.7; color:var(--muted); max-width:440px; margin-top:14px; }
    .weather-info p { margin:3px 0; }
    .weather-info p:first-child { color:#c4cbd6; font-size:12px; }
    .weather-credit { font-size:10px; opacity:.7; }
    .weather-credit a { color:inherit; text-decoration-color:#677383; text-underline-offset:3px; }
    .world-controls { display:flex; align-items:center; justify-content:center; gap:20px; margin-top:8px; }
    .world-controls .text-button { min-height:44px; }
    .world-controls .seconds-control { min-height:44px; }
    .companion-hint { color:#a5b2c4; }
    .preview-active #weather-status,.preview-active #weather-age { display:none; }
    #preview-mode { display:flex; align-items:center; gap:16px; justify-content:center; color:#e0c4a5; flex-wrap:wrap; }
    #preview-mode .text-button { min-height:44px; color:#f2d8b8; text-decoration:underline; text-underline-offset:4px; }
    .weather-gallery { position:fixed; z-index:20; bottom:max(20px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); width:min(900px,calc(100vw - 40px)); max-height:55svh; overflow:auto; padding:24px; border:1px solid rgba(222,230,245,.18); border-radius:24px; background:rgba(12,16,23,.95); box-shadow:0 25px 100px #000a; -webkit-backdrop-filter:blur(25px); backdrop-filter:blur(25px); }
    .gallery-heading { display:flex; justify-content:space-between; align-items:center; gap:14px; }

    .gallery-heading h2 { margin:0; font:400 22px "Songti SC",serif; letter-spacing:.04em; }

    .city-form { width:min(360px,90vw); margin-top:13px; background:rgba(15,21,30,.8); border:1px solid var(--rim); border-radius:18px; padding:12px 16px; }

  const gallery=$('#weather-gallery'), previewGrid=$('#preview-grid');
  const appearance=$('#appearance-panel');
  function syncPanels() {document.body.classList.toggle('panel-open',!appearance.hidden||!gallery.hidden);requestAnimationFrame(layoutDigits);}
  function closeAppearance() {appearance.hidden=true;$('#appearance-toggle').setAttribute('aria-expanded','false');syncPanels();}
  $('#appearance-toggle').addEventListener('click',()=>{
    if(isFullscreen())return;
    const show=appearance.hidden;appearance.hidden=!show;$('#appearance-toggle').setAttribute('aria-expanded',String(show));
    if(show){gallery.hidden=true;$('#weather-browse').setAttribute('aria-expanded','false');$('#digit-font').focus({preventScroll:true});}
    syncPanels();
  });
  $('#appearance-close').addEventListener('click',()=>{if(!isFullscreen()){closeAppearance();$('#appearance-toggle').focus();}});
  for(const key of ['size','weight','spacing','font']) $(`#digit-${key}`).addEventListener('input',event=>{
    if(isFullscreen()){applySettings();return;}
    const value=key==='font'?event.target.value:Number(event.target.value);
    if(key==='font'?!Object.hasOwn(fontFamilies,value):!Number.isFinite(value)||value<settingBounds[key][0]||value>settingBounds[key][1])return;
    settings[key]=value;applySettings();saveSettings();tick(false);
  });
  $('#use-glass').addEventListener('change',event=>{if(isFullscreen()){applySettings();return;}settings.glass=event.target.checked;applySettings();saveSettings();tick(false);});
  document.querySelectorAll('[data-clock-preset]').forEach(button=>button.addEventListener('click',()=>{if(isFullscreen())return;Object.assign(settings,presets[button.dataset.clockPreset]);applySettings();saveSettings();tick(false);}));
  $('#appearance-reset').addEventListener('click',()=>{if(isFullscreen())return;Object.assign(settings,defaultAppearance);applySettings();saveSettings();tick(false);});
  function pausePreview() {
    clearInterval(previewTimer);previewTimer=null;
    $('#preview-play').textContent='自动轮播';$('#preview-play').setAttribute('aria-pressed','false');
  }
  function choosePreview(index) {
    if(isFullscreen()) return;
    previewIndex=index;
    $('#preview-mode').hidden=index<0;
    $('#preview-name').textContent=index<0 ? '' : `效果预览 · ${previews[index][1]}`;
    $('#gallery-current').textContent=index<0 ? '实时天气' : `正在预览：${previews[index][1]}`;
    $('.weather-info').classList.toggle('preview-active',index>=0);
    previewGrid.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
    tick(false);
  }
  previews.forEach(([id,label],index)=>{
    const button=document.createElement('button');button.type='button';button.dataset.preview=id;
    button.className='preview-option';button.textContent=label;button.setAttribute('aria-pressed','false');
    button.addEventListener('click',()=>{if(isFullscreen())return;pausePreview();choosePreview(index);});previewGrid.append(button);
  });
  $('#weather-browse').addEventListener('click',()=>{
    if(isFullscreen())return;
    closeAppearance();
    gallery.hidden=!gallery.hidden;$('#weather-browse').setAttribute('aria-expanded',String(!gallery.hidden));
    if(!gallery.hidden) (previewGrid.children[Math.max(0,previewIndex)]).focus({preventScroll:true});
    syncPanels();
  });
  $('#gallery-close').addEventListener('click',()=>{
    if(isFullscreen())return;
    gallery.hidden=true;$('#weather-browse').setAttribute('aria-expanded','false');$('#weather-browse').focus();
    syncPanels();
  });
  document.querySelectorAll('[data-return-live]').forEach(button=>button.addEventListener('click',()=>{if(!isFullscreen()){pausePreview();choosePreview(-1);}}));
  $('#preview-play').addEventListener('click',()=>{
    if(isFullscreen())return;
    if(previewTimer){pausePreview();return;}
    choosePreview((previewIndex+1)%previews.length);
    $('#preview-play').textContent='暂停轮播';$('#preview-play').setAttribute('aria-pressed','true');
    previewTimer=setInterval(()=>{if(!document.hidden&&!isFullscreen())choosePreview((previewIndex+1)%previews.length);},5000);
  });
  function validLocation(value) {
    return value && Number.isFinite(value.latitude) && Math.abs(value.latitude)<=90 && Number.isFinite(value.longitude) && Math.abs(value.longitude)<=180 && ['device','city'].includes(value.source);
  }
  function validateWeather(data) {
    const c=data?.current, d=data?.daily;
    if (!c || !d || !knownCodes.includes(c.weather_code) || ![0,1].includes(c.is_day) || ![c.time,c.cloud_cover,c.precipitation,c.wind_speed_10m].every(Number.isFinite) || c.cloud_cover<0 || c.cloud_cover>100 || c.precipitation<0 || c.wind_speed_10m<0) throw Error('天气数据不完整');
    if (!Array.isArray(d.time) || !d.time.length || !d.time.every(Number.isFinite) || !['sunrise','sunset','moonrise','moonset','moon_phase'].every(key => Array.isArray(d[key]) && d[key].length===d.time.length && d[key].every(v => v===null || Number.isFinite(v)))) throw Error('日月数据不完整');
    return data;
  }
  function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => { if(document.hidden) scheduleRefresh(); else refreshWeather(); }, REFRESH_MS); }
  async function loadWeather() {
    const location=weather.location; if(!validLocation(location)) return;
    const request=++weatherRequest; weatherController?.abort(); weatherController=new AbortController();
    const controller=weatherController, timeout=setTimeout(()=>controller.abort(),15000);
    lastAttempt=Date.now(); status.textContent=`${location.label} · 正在更新天气…`; scheduleRefresh();
    const params=new URLSearchParams({latitude:String(location.latitude),longitude:String(location.longitude),current:'weather_code,cloud_cover,is_day,precipitation,wind_speed_10m',daily:'sunrise,sunset,moonrise,moonset,moon_phase',timezone:'auto',timeformat:'unixtime',past_days:'1',forecast_days:'3'});
    try {
      const response=await fetch(`https://api.open-meteo.com/v1/forecast?${params}`,{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});
      if(!response.ok) throw Error(`天气服务暂不可用（${response.status}）`);
      const data=validateWeather(await response.json()); if(request!==weatherRequest) return;
      weather={location,data,fetchedAt:Date.now()};
      try {localStorage.setItem('floating-light-weather',JSON.stringify(weather));} catch {}
      status.textContent=`${location.label} · ${weatherKind(data.current.weather_code)[1]}`;
      tick(false);
    } catch(error) {
      if(request!==weatherRequest) return;
      status.textContent=`天气暂时无法更新${weather.data ? '，保留上次天气' : '，等待恢复连接'}。稍后自动重试。`;
    } finally {clearTimeout(timeout);}
  }
  function selectLocation(location) {
    const changed=!weather.location || location.latitude!==weather.location.latitude || location.longitude!==weather.location.longitude;
    weather.location=location;
    if(changed) {weather.data=null;weather.fetchedAt=0;}
    tick(false); loadWeather();
  }
  function locate(manual = true) {
    if(locating && !manual) return;
    const request=++locationRequest; locating=true; locateButton.disabled=true;
    status.textContent='正在获取当地位置…';
    const failure=error => {
      if(request!==locationRequest) return;
      locating=false;locateButton.disabled=false;
      const message=error?.code===1 ? '定位未获允许，可在浏览器中允许定位，或手动选择城市。' : '暂时无法定位，可重试或手动选择城市。';
      if(manual) {
        const notice=$('#notice');notice.textContent=message;notice.hidden=false;
        clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.hidden=true,7000);
      }
      if(weather.location) {loadWeather();status.textContent=message+' 正沿用上次位置查询。';}
      else {status.textContent=message;$('#city-form').hidden=false;$('#city-toggle').setAttribute('aria-expanded','true');}
    };
    if(!navigator.geolocation || !window.isSecureContext) {failure();return;}
    navigator.geolocation.getCurrentPosition(position => {
      if(request!==locationRequest) return;
      locating=false;locateButton.disabled=false;
      // Weather grids do not need exact coordinates; send only about 1 km precision.
      const location={latitude:Math.round(position.coords.latitude*100)/100,longitude:Math.round(position.coords.longitude*100)/100,label:'当前位置',source:'device'};
      if(!validLocation(location)) {failure();return;} selectLocation(location);
    },failure,{enableHighAccuracy:false,timeout:12000,maximumAge:REFRESH_MS});
  }
  function refreshWeather() { if(weather.location?.source==='city') loadWeather(); else if(weather.location) locate(false); }
  const cityForm=$('#city-form'), cityResults=$('#city-results');
  $('#city-toggle').addEventListener('click',() => {
    if(isFullscreen()) return;
    cityForm.hidden=!cityForm.hidden;$('#city-toggle').setAttribute('aria-expanded',String(!cityForm.hidden));
    if(!cityForm.hidden) $('#city-name').focus();
  });
  cityForm.addEventListener('submit',async event => {
    event.preventDefault(); if(isFullscreen()) return;
    const name=$('#city-name').value.trim(); if(name.length<2) {cityResults.textContent='请输入至少两个字的城市名。';return;}
    searchController?.abort(); const controller=searchController=new AbortController(), timeout=setTimeout(()=>controller.abort(),12000);
    cityResults.textContent='正在查找城市…';
    try {
      const response=await fetch(`https://geocoding-api.open-meteo.com/v1/search?${new URLSearchParams({name,count:'5',language:'zh',format:'json'})}`,{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});
      if(!response.ok) throw Error(); const data=await response.json(); if(searchController!==controller) return;
      const results=(Array.isArray(data.results)?data.results:[]).filter(item=>validLocation({...item,source:'city'}));
      cityResults.replaceChildren(); if(!results.length) cityResults.textContent='没有找到，可试试城市英文名。';
      results.forEach(item=>{
        const button=document.createElement('button');button.type='button';button.className='city-result';
        const label=[item.name,item.admin1,item.country].filter(v=>typeof v==='string').join(' · ');
        button.textContent=label;
        button.addEventListener('click',()=>{
          if(isFullscreen()) return;
          ++locationRequest;locating=false;locateButton.disabled=false;
          selectLocation({latitude:Math.round(item.latitude*100)/100,longitude:Math.round(item.longitude*100)/100,label,source:'city'});
          cityForm.hidden=true;$('#city-toggle').setAttribute('aria-expanded','false');
        });cityResults.append(button);
      });
    } catch {if(searchController===controller) cityResults.textContent='城市查询暂不可用，请稍后重试。';} finally {clearTimeout(timeout);}
  });
  secondsInput.addEventListener('change',()=>{if(isFullscreen()){applySettings();return;}settings.seconds=secondsInput.checked;applySettings();saveSettings();tick(false);});
  $('#show-companion').addEventListener('change',event=>{if(isFullscreen()){applySettings();return;}settings.companion=event.target.checked;applySettings();saveSettings();});
  locateButton.addEventListener('click',()=>{if(!isFullscreen()) locate();});
  document.addEventListener('visibilitychange',()=>{tick(false);if(!document.hidden && Date.now()-lastAttempt>=REFRESH_MS) refreshWeather();});
  window.addEventListener('online',()=>{if(weather.location) loadWeather();});
  window.addEventListener('pageshow',()=>tick(false));
  window.addEventListener('resize',layoutDigits);
  window.addEventListener('scroll',()=>scene.setClockBounds?.($('.clock').getBoundingClientRect()),{passive:true});
  reducedMotion.addEventListener('change',()=>tick(false));
  function syncFullscreen(active) {
    if(active) pausePreview();
    document.body.classList.toggle('is-fullscreen',active);
    document.querySelectorAll('.editor-only').forEach(element=>element.inert=active);
    fullscreen.setAttribute('aria-pressed',String(active));
    window.scrollTo(0,0); glassDigits.refresh(); tick(false);
    requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')));
  }
  fullscreen.addEventListener('click',async()=>{
    const enter=document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
    // ponytail: older iPad browsers use an in-page immersive view when native fullscreen is unavailable.
    try {if(!enter) throw Error(); await enter.call(document.documentElement);}
    catch {syncFullscreen(true);}
  });
  for(const name of ['fullscreenchange','webkitfullscreenchange']) document.addEventListener(name,()=>syncFullscreen(Boolean(document.fullscreenElement || document.webkitFullscreenElement)));
  async function exitFullscreen() {
    const exit=document.exitFullscreen || document.webkitExitFullscreen;
    if((document.fullscreenElement || document.webkitFullscreenElement) && exit) {try {await exit.call(document);} catch {}}
    else syncFullscreen(false);
  }
  document.addEventListener('keydown',event=>{if(event.key==='Escape' && isFullscreen()) exitFullscreen();});
  document.addEventListener('dblclick',event=>{if(isFullscreen() && !event.target.closest('button,input,label,a')) exitFullscreen();});
  let lastTouch=null;
  document.addEventListener('pointerup',event=>{
    if(event.pointerType!=='touch' || !isFullscreen() || event.target.closest('button,input,label,a')) return;
    const touch={x:event.clientX,y:event.clientY,time:performance.now()};
    if(lastTouch && touch.time-lastTouch.time<340 && Math.hypot(touch.x-lastTouch.x,touch.y-lastTouch.y)<24) {lastTouch=null;exitFullscreen();}
    else lastTouch=touch;
  });
  try {
    const cached=JSON.parse(localStorage.getItem('floating-light-weather'));
    if(validLocation(cached?.location)) {
      weather.location={...cached.location,label:typeof cached.location.label==='string'?cached.location.label:'上次位置'};
      if(Number.isFinite(cached.fetchedAt) && Date.now()-cached.fetchedAt<6*3600000 && cached.fetchedAt<=Date.now()+60000) {
        weather.data=validateWeather(cached.data);weather.fetchedAt=cached.fetchedAt;
        status.textContent='显示上次天气，正在更新…';
      }
    }
  } catch {}
  applySettings();tick(false);
  if(weather.location?.source==='city') loadWeather();else locate(false);
})();

  </script>
</body>
</html>
